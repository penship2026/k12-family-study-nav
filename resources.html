<style>
  :root{

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
  .wrap{max-width:1020px;margin:0 auto;padding:16px 16px 60px}
  .topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .btn-back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;text-decoration:none;color:var(--ink)}
  h1{font-size:22px;margin:6px 0}
  .lead{color:var(--sub);font-size:14px;margin-bottom:12px}
  .notice{background:#e7f1ec;border-left:3px solid var(--brand);padding:10px 14px;border-radius:8px;font-size:13px;color:#335647;margin:12px 0 18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 15px;font-size:13.5px;cursor:pointer;color:var(--sub)}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .card h2{font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h2 .bar{width:4px;height:16px;border-radius:2px}
  .card .sub{color:var(--sub);font-size:13px;margin-bottom:12px}
  .band{margin:16px 0 6px;font-size:14px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center}
  .band span{font-size:11.5px;font-weight:400;color:var(--sub);background:var(--bg);border-radius:6px;padding:1px 8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
  th{background:#faf8f2;font-weight:600;font-size:13px}
  tr:last-child td{border-bottom:none}
  td.g{width:70px;font-weight:600;white-space:nowrap;color:var(--sub)}
  td.s{color:var(--sub);white-space:nowrap}
  td.c{width:76px;color:var(--sub);white-space:nowrap}
  ul.pts{margin:6px 0 0 18px;font-size:13.5px}
  ul.pts li{margin-bottom:6px}
  ul.res-li{list-style:none;margin-top:8px}
  ul.res-li li{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
  ul.res-li li:first-child{border-top:none}
  ul.res-li a{color:var(--math);text-decoration:none;font-weight:600}
  ul.res-li span{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
  .tip{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
  .warn{border-left:3px solid #c98f6a;background:#fbf3ec;color:#7b5236;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:10px}
  .src{font-size:12px;color:var(--sub);margin-top:10px}
  footer{color:var(--sub);font-size:12.5px;text-align:center;margin-top:26px;line-height:1.8}

  /* ===== 移动端 ===== */
  @media(max-width:760px){
    .wrap{padding:12px 14px 48px}
    h1{font-size:19px}
    .lead{font-size:13px}
    .notice{font-size:12.5px;padding:9px 12px}
    .topbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .topbar::-webkit-scrollbar{display:none}
    .btn-back{flex:0 0 auto;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
    .tabs{flex-wrap:nowrap;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin-bottom:6px}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{flex:0 0 auto;white-space:nowrap;min-height:44px;padding:8px 13px;font-size:13px}
    .secnav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .secnav::-webkit-scrollbar{display:none}
    .secnav a,.secnav button{flex:0 0 auto;min-height:40px}
    .secnav .spacer{display:none}
    .card{scroll-margin-top:calc(var(--hdrH,57px) + 73px)}
    .bfilter{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .bfilter::-webkit-scrollbar{display:none}
    .bfilter button{flex:0 0 auto;min-height:38px}
    .bfilter .cnt{display:none}
    .card{padding:14px;border-radius:12px;margin-bottom:12px}
    .card h2{font-size:16px}
    .band{margin:14px 0 4px;font-size:13.5px;flex-wrap:wrap}
    /* 110 种书单：窄屏隐藏分类列，书名换行，作者同格显示 */
    .books{white-space:normal;display:block}
    .books thead{display:none}
    .books tr{display:block;padding:9px 10px;border-bottom:1px dashed var(--line)}
    .books td{border:0;padding:0}
    .books td.c{display:inline-block;font-size:10.5px;color:#8a6b4a;background:#faf8f2;border-radius:4px;
      padding:1px 6px;margin-right:6px;vertical-align:1px;white-space:nowrap}
    .books td:nth-child(2){display:inline;font-weight:600}
    .books td.s{display:block;font-size:12px;color:var(--sub);margin-top:2px;white-space:normal}
    /* 表格宽了就横向滑动，首列吸住不跟着跑 */
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
    th,td{padding:8px}
    td.g,td.c,td.s{width:auto}
    th:first-child,td:first-child{position:sticky;left:0;background:#faf8f2;z-index:2}
    tbody td:first-child{background:#fff}
    ul.res-li li{font-size:13.5px}
    ul.res-li a{min-height:36px;display:inline-flex;align-items:center}
    .tip,.warn,.src{font-size:12.5px}

  .stickyhead.stuck{border-bottom-color:var(--line);box-shadow:0 4px 10px -8px rgba(0,0,0,.25)}

  .secnav .spacer{flex:1}
  .card{scroll-margin-top:calc(var(--hdrH,57px) + 53px)}

  .card.collapsed .card-body{display:none}
  .card.collapsed h2{margin-bottom:0}
  .bfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
  .bfilter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;
    font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap}

  .bfilter .cnt{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}

    font-size:18px;color:var(--sub);cursor:pointer;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .to-top.show{opacity:1;pointer-events:auto}

  .sitehdr{background:#fff;border-bottom:1px solid var(--line,#e8e3d7);position:sticky;top:0;z-index:60;

    .navmenu a{padding:12px 10px;min-height:44px;display:flex;align-items:center;font-size:14px}
    .bt b{font-size:15.5px}
    .bt i{font-size:11px}
    .mark{width:30px;height:30px;font-size:15px;border-radius:8px}
    .phead{padding:14px 0 4px}
    .phead h1{font-size:19px}
  }
  @media print{.sitehdr,.navbtn{display:none !important}}
  .hdr{max-width:1020px}
</style>

  </table>
  <div class="tip"><b>渠道：</b>央视网 / 央视频（官方免费）、B站官方账号；短视频平台上的切片只当"发现片名"，完整片还是回官方看。</div>
</div>

<div class="card">
  <h2><span class="bar" style="background:var(--media)"></span>抖音 / 小红书 采集方法（可复制）</h2>
  <div class="sub">这两个平台的价值是"发现候选"和"看同龄人实际在读什么"，不是权威结论。</div>
  <ul class="pts">
    <li><b>检索模板：</b>「小学 二年级 书单」「小学生 纪录片 推荐」「自然拼读 教材 对比」「数学绘本 一题多解」——加年级、加"对比/避坑"更容易搜到干货。</li>
    <li><b>看什么信号：</b>同一本书被不同博主反复提到 → 进候选；只有一条爆款、评论区全是"求链接" → 大概率是带货。</li>
    <li><b>怎么落地：</b>把书名抄下来 → 教育部目录 / 出版社官网 / 图书馆检索 → 借到先读 → 孩子真喜欢再买。</li>
    <li><b>直接跳过：</b>"3 天读完 100 本""XX 天突破 3000 词""限时 1 元领全套""内部书单不外传"。</li>
  </ul>
  <div class="warn"><b>结论：</b>抖音、小红书的书单 ≈ 名校书单 + 绘本畅销榜，偏"好读、好看"；官方目录偏"经典、价值观"。两者不冲突：<b>用平台选兴趣，用官方定底线</b>。</div>
</div>`;

const PANELS={gov:buildGov(),read:READ,eng:ENG,math:MATH,call:CALL,art:ART,techsport:TECHSPORT,media:MEDIA};
let cur = "gov";

function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.textContent=t.name;
    if(t.id===cur) b.classList.add("active");
    b.onclick=()=>{cur=t.id;render()};
    el.appendChild(b);
  });
}
function render(){
  renderTabs();
  document.getElementById("panels").innerHTML = PANELS[cur];
  decorate();
}

/* 卡片折叠 + 卡片锚点导航 */
function decorate(){
  const cards=[...document.querySelectorAll("#panels .card")];
  cards.forEach((c,i)=>{
    if(!c.id) c.id="r"+(i+1);
    const h=c.querySelector("h2");
    if(h && !h.querySelector(".ctog")){
      const btn=document.createElement("button");
      btn.type="button"; btn.className="ctog"; btn.textContent=c.classList.contains("collapsed")?"展开":"收起";
      btn.onclick=e=>{e.stopPropagation(); toggleCard(c)};
      h.appendChild(btn);
    }
  });
  cards.forEach(bindFilter);
  buildNav(cards);
}

/* 书单分类筛选（每个学段卡各一套，互不影响） */
function bindFilter(card){
  const bar=card.querySelector(".bfilter");
  if(!bar || bar.dataset.bound) return;
  bar.dataset.bound="1";
  const rows=[...card.querySelectorAll(".books tbody tr")];
  const cnt=bar.querySelector(".cnt");
  bar.addEventListener("click",e=>{
    const btn=e.target.closest("button[data-cat]");
    if(!btn) return;
    const cat=btn.dataset.cat;
    bar.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===btn));
    let shown=0;
    rows.forEach(tr=>{
      const c=(tr.querySelector("td.c")||tr.cells[0]).textContent.trim();
      const hit = cat==="全部" || c===cat;
      tr.style.display = hit ? "" : "none";
      if(hit) shown++;
    });
    if(cnt) cnt.textContent=`当前显示 ${shown} / 共 ${rows.length} 种`;
  });
}

function toggleCard(c,force){
  const willCollapse = force===undefined ? !c.classList.contains("collapsed") : force;
  c.classList.toggle("collapsed", willCollapse);
  const b=c.querySelector(".ctog"); if(b) b.textContent = willCollapse ? "展开" : "收起";
  syncNav(cardsAll());
}
const cardsAll=()=>[...document.querySelectorAll("#panels .card")];

function buildNav(cards){
  const nav=document.getElementById("secnav"); nav.innerHTML="";
  if(!cards.length) return;
  cards.forEach(c=>{
    const raw=(c.querySelector("h2")||{}).textContent||"";
    let name=raw.replace(/收起|展开/g,"").trim().replace(/(课内|课外)$/,"");
    name=name.split(/[：:（(]/)[0];
    name=name.length>9 ? name.slice(0,8)+"…" : name;
    if(!name) name="模块";
    const a=document.createElement("a");
    a.href="#"+c.id; a.textContent=name;
    a.onclick=e=>{e.preventDefault(); toggleCard(c,false); c.scrollIntoView({behavior:"smooth",block:"start"});};
    nav.appendChild(a);
  });
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  const btn=document.createElement("button"); btn.type="button"; btn.id="allTog";
  btn.onclick=()=>{
    const cards=cardsAll();
    const allExp=cards.every(c=>!c.classList.contains("collapsed"));
    cards.forEach(c=>toggleCard(c,allExp));
  };
  nav.appendChild(btn);
  syncNav(cards);
}
function syncNav(cards){
  const btn=document.getElementById("allTog"); if(!btn) return;
  btn.textContent = cards.every(c=>!c.classList.contains("collapsed")) ? "全部收起" : "全部展开";
}

const sh=document.getElementById("stickyhead");
addEventListener("scroll",()=>sh && sh.classList.toggle("stuck",scrollY>8),{passive:true});

render();

const toTop=document.getElementById("toTop");
addEventListener("scroll",()=>toTop.classList.toggle("show",scrollY>600),{passive:true});
toTop.onclick=()=>scrollTo({top:0,behavior:"smooth"});

/* 移动端菜单 */
const navBtn=document.getElementById("navBtn"), navMenu=document.getElementById("navMenu");
if(navBtn && navMenu){
  navBtn.onclick=()=>{
    const open=navMenu.classList.toggle("open");
    navBtn.setAttribute("aria-expanded", open?"true":"false");
    navBtn.textContent = open ? "✕" : "☰";
  };
  navMenu.addEventListener("click",e=>{ if(e.target.tagName==="A"){ navMenu.classList.remove("open"); navBtn.textContent="☰"; } });
}

/* 固定头部高度变量 + 吸顶阴影 */
(function(){
  const hd=document.querySelector(".sitehdr"); if(!hd) return;
  const set=()=>{
    document.documentElement.style.setProperty("--hdrH", hd.offsetHeight+"px");
    hd.classList.toggle("stuck", hd.getBoundingClientRect().top<=0 && scrollY>4);
  };
  set(); addEventListener("resize",set);
  addEventListener("scroll",()=>hd.classList.toggle("stuck", scrollY>4),{passive:true});
})();
</script>
</body>
